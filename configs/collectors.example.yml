# ==============================================================================
# 采集器配置示例 (collectors.example.yml)
# ==============================================================================
#
# 【使用说明】
#   本文件是完整的配置示例和参考文档
#   复制本文件为 collectors.yml 使用，或按需修改
#
#   cp configs/collectors.example.yml configs/collectors.yml
#
# 【配置优先级】（从高到低）
#   1. ENV 环境变量：COLLECTOR_{NAME}_{FIELD}
#   2. collectors.local.yml（本地覆盖，不提交 git）
#   3. collectors.yml（主配置文件）
#   4. 本文件（示例参考，不修改）
#
# 【采集器发现机制】
#   采集器自动扫描 src/collector/source_*.py 文件
#   - 文件名：source_{name}.py → 采集器名称 {name}
#   - 类名：任意（继承 BaseCollector 即可）
#   无需手动注册，只需创建文件即可
#
# 【新增采集器步骤】
#   1. 创建 src/collector/source_xxx.py（继承 BaseCollector）
#   2. 在下方 collectors 中添加配置（可选）
#   3. 或使用 ENV 覆盖：COLLECTOR_XXX_ENABLED=true
#   4. 完成！自动发现，无需改代码
#
# 【cron 调度时间格式】（分 时 日 月 周）
#   "0 0 * * *"     → 每天 00:00
#   "0 */2 * * *"   → 每 2 小时（00:00, 02:00, ...）
#   "30 0 * * *"    → 每天 00:30
#   "0 */3 * * *"   → 每 3 小时（00:00, 03:00, ...）
#   "*/5 * * * *"   → 每 5 分钟
#   "0 9 * * 1-5"   → 工作日 09:00
#   "0 0 * * 0"     → 每周日 00:00
# ==============================================================================


# ===========================================================================
# 全局调度配置（所有采集器的默认值）
# ===========================================================================
scheduler:
  # 是否并行执行所有采集器（true=并行，false=串行）
  parallel: false

  # 默认调度时间（cron 表达式）
  # 格式：分 时 日 月 周
  # 示例：
  #   "0 0 * * *"      每天 00:00
  #   "0 */2 * * *"    每 2 小时
  #   "30 8 * * 1-5"   工作日 08:30
  #   "*/10 * * * *"   每 10 分钟
  default_cron: "0 0 * * *"

  # 最大并发任务数（并行模式时生效）
  max_workers: 5

  # 单任务超时时间（秒）
  timeout: 300

  # 失败重试次数
  retry: 3

  # 重试间隔（秒）
  retry_delay: 60


# ===========================================================================
# 采集器配置
# ===========================================================================
#
# 【字段说明】
#   enabled  : 是否启用（true/false，默认 true）
#   cron     : 调度时间（覆盖全局 default_cron）
#   timeout  : 超时时间（覆盖全局 timeout）
#   retry    : 重试次数（覆盖全局 retry）
#   persist  : 是否持久化到数据库（默认 true）
#              - true: 采集数据保存到数据库
#              - false: 只走采集→清洗→校验流程，不入库（用于并发测试）
#   config   : 采集器特定配置（自定义，传递给采集器）
#
# 【ENV 覆盖格式】
#   COLLECTOR_{NAME}_{FIELD}=value
#   示例：
#     COLLECTOR_EXAMPLE_ALERION_ENABLED=true
#     COLLECTOR_EXAMPLE_ASL_CRON=0 */3 * * *
#     COLLECTOR_EXAMPLE_LUX_TIMEOUT=600
#
# ===========================================================================

collectors:

  # =========================================================================
  # 示例采集器（航空数据，衍生项目可参考或删除）
  # =========================================================================

  # Alerion（Alerion Aviation，美国公务机包机商）- POST JSON API 采集
  example_alerion:
    enabled: true
    cron: "0 */2 * * *"           # 每 2 小时
    timeout: 300
    retry: 3
    persist: true                 # 入库
    config:                       # 采集器特定配置
      operator_id: "cc2f0c109f7811ec81a473925ff7fe99"
      api_url: "https://int-quoting-legacy.flyeasy.co/api/search"

  # ASL（ASL Group，比利时公务航空集团）- HTML 分页采集
  example_asl:
    enabled: true
    cron: "30 0 * * *"            # 每天 00:30
    timeout: 600                  # HTML 解析较慢
    retry: 2
    persist: true

  # LuxAviation（卢森堡全球公务航空集团）- POST JSON API 分页采集（数据量最大，200+条）
  example_lux:
    enabled: true
    cron: "0 */3 * * *"           # 每 3 小时
    timeout: 300
    retry: 2
    persist: true
    config:
      operator_id: "804d5f81fee1458dbf5140679f60c65c"
      api_url: "https://lms-api.luxaviation.com/ext-lead/load-emptylegs"

  # Silver（Silverhawk Aviation，美国公务机运营商）- HTML 卡片解析采集（190+条）
  example_silver:
    enabled: true
    cron: "0 */4 * * *"           # 每 4 小时
    timeout: 300
    retry: 2
    persist: true

  # ChartRight（Chartright Air Group，加拿大包机公司）- HTML 卡片解析采集（40+条）
  example_chartright:
    enabled: true
    cron: "30 */2 * * *"          # 每 2 小时半点
    timeout: 300
    retry: 2
    persist: true

  # =========================================================================
  # 并发模拟采集器（用于测试并发，不入库）
  # =========================================================================
  # 这三个采集器的唯一用途是验证 run_parallel_collectors 是否真正并行执行
  # 它们通过不同延迟（2s/1s/0.5s）模拟不同速度的网站
  # 串行执行需 3.5s，并行执行只需 ~2s（取决于最慢的那个）
  # 默认禁用 + persist:false，测试时手动启用即可

  # 慢速采集器（模拟 2s 延迟）
  example_slow:
    enabled: false
    cron: "*/5 * * * *"
    timeout: 30
    persist: false

  # 中速采集器（模拟 1s 延迟）
  example_medium:
    enabled: false
    cron: "*/5 * * * *"
    timeout: 30
    persist: false

  # 快速采集器（模拟 0.5s 延迟）
  example_fast:
    enabled: false
    cron: "*/5 * * * *"
    timeout: 30
    persist: false

