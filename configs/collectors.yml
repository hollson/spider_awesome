# ==============================================================================
# 采集器配置 (collectors.yml)
# ==============================================================================
#
# 【使用说明】
#   本文件配置所有采集器的启停、调度、参数
#   完整示例请参考 collectors.example.yml
#
#   cp configs/collectors.example.yml configs/collectors.yml
#
# 【配置优先级】（从高到低）
#   1. ENV 环境变量：COLLECTOR_{NAME}_{FIELD}
#   2. collectors.local.yml（本地覆盖，不提交 git）
#   3. 本文件
#
# 【采集器发现机制】
#   采集器自动扫描 src/collector/source_*.py 文件
#   无需手动注册，创建文件即可
# ==============================================================================


# ===========================================================================
# 全局调度配置（默认值）
# ===========================================================================
scheduler:
  parallel: false              # 是否并行执行所有采集器
  default_cron: "0 0 * * *"    # 默认调度时间（每天 00:00）
  max_workers: 5               # 最大并发数
  timeout: 300                 # 单任务超时（秒）
  retry: 3                     # 失败重试次数
  retry_delay: 60              # 重试间隔（秒）


# ===========================================================================
# 采集器配置
# ===========================================================================
# 格式：{name}: {enabled, cron, timeout, retry, config}
# 完整示例参考 collectors.example.yml
# ===========================================================================

collectors:
  # ----- 示例采集器（飞机数据）-----
  alerion:
    enabled: true
    cron: "0 */2 * * *"        # 每 2 小时

  asl:
    enabled: true
    cron: "30 0 * * *"         # 每天 00:30
    timeout: 600

  noble:
    enabled: false

  example:
    enabled: true
    cron: "0 */6 * * *"        # 每 6 小时
