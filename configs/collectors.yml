# ==============================================================================
# 采集器配置 (collectors.yml)
# ==============================================================================
#
# 【使用说明】
#   本文件配置所有采集器的启停、调度、参数
#   完整示例请参考 collectors.example.yml
#
#   cp configs/collectors.example.yml configs/collectors.yml
#
# 【配置优先级】（从高到低）
#   1. ENV 环境变量：COLLECTOR_{NAME}_{FIELD}
#   2. collectors.local.yml（本地覆盖，不提交 git）
#   3. 本文件
#
# 【采集器发现机制】
#   采集器自动扫描 src/collector/source_*.py 文件
#   无需手动注册，创建文件即可
#
# 【cron 调度时间格式】（分 时 日 月 周）
#   "0 0 * * *"     → 每天 00:00
#   "0 */2 * * *"   → 每 2 小时（00:00, 02:00, ...）
#   "30 0 * * *"    → 每天 00:30
#   "0 */3 * * *"   → 每 3 小时（00:00, 03:00, ...）
#   "*/5 * * * *"   → 每 5 分钟
#   "0 9 * * 1-5"   → 工作日 09:00
#   "0 0 * * 0"     → 每周日 00:00
# ==============================================================================


# ===========================================================================
# 全局调度配置（默认值）
# ===========================================================================
scheduler:
  parallel: false              # 是否并行执行所有采集器
  default_cron: "0 0 * * *"    # 默认调度时间：每天 00:00
  max_workers: 5               # 最大并发数
  timeout: 300                 # 单任务超时（秒）
  retry: 3                     # 失败重试次数
  retry_delay: 60              # 重试间隔（秒）


# ===========================================================================
# 采集器配置
# ===========================================================================
# 格式：{name}: {enabled, cron, timeout, retry, persist, config}
#
# persist: 是否持久化到数据库（默认 true）
#   - true: 采集数据保存到数据库
#   - false: 只走采集→清洗→校验流程，不入库（用于并发测试）
#
# 注意：name 必须与 source_*.py 文件名对应
#   source_example_alerion.py → example_alerion
#   source_example_asl.py → example_asl
#   source_example_lux.py → example_lux
#   source_example_silver.py → example_silver
#   source_example_chartright.py → example_chartright
#   source_example.py → example_slow, example_medium, example_fast
# ===========================================================================

collectors:
  # ----- 示例采集器（衍生项目可参考或删除）-----
  example_alerion:
    enabled: true
    cron: "0 */2 * * *"        # 每 2 小时
    persist: true

  example_asl:
    enabled: true
    cron: "30 0 * * *"         # 每天 00:30
    timeout: 600
    persist: true

  # LuxAviation - POST JSON API 分页采集（数据量最大）
  example_lux:
    enabled: true
    cron: "0 */3 * * *"        # 每 3 小时
    persist: true

  # Silver - HTML 卡片解析采集
  example_silver:
    enabled: true
    cron: "0 */4 * * *"        # 每 4 小时
    persist: true

  # ChartRight - HTML 卡片解析采集
  example_chartright:
    enabled: true
    cron: "30 */2 * * *"       # 每 2 小时半点
    persist: true

  # ----- 并发模拟采集器（用于测试并发，不入库）-----
  # 这三个采集器的唯一用途是验证 run_parallel_collectors 是否真正并行执行
  # 它们通过不同延迟（2s/1s/0.5s）模拟不同速度的网站
  # 串行执行需 3.5s，并行执行只需 ~2s（取决于最慢的那个）
  # 默认禁用 + persist:false，测试时手动启用即可
  example_slow:
    enabled: false
    cron: "*/5 * * * *"
    timeout: 30
    persist: false

  example_medium:
    enabled: false
    cron: "*/5 * * * *"
    timeout: 30
    persist: false

  example_fast:
    enabled: false
    cron: "*/5 * * * *"
    timeout: 30
    persist: false
